<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatthewDrake - Scene 4: Stream Ending</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:ital,wght@0,300;0,500;0,600;0,800;0,900;1,800&family=Noto+Sans+JP:wght@700;900&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-bright: #c084fc;
      --purple-deep: #4c1d95;
      --bg-black: #07060e;
      --white: #ffffff;
      
      --accent-main: rgb(6, 182, 212);
      --accent-bright: rgb(103, 232, 249);
      --accent-glow: rgba(6, 182, 212, 0.65);
      
      --purple-glow: rgba(168, 85, 247, 0.6);
      --border-purple: rgba(168, 85, 247, 0.45);
      --gray-text: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-black);
      font-family: 'Kanit', 'Bebas Neue', sans-serif;
      color: var(--white);
    }

    .stream-canvas {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      background: var(--bg-black);
      overflow: hidden;
    }

    #sparksCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
    }

    .laser-scanner {
      position: absolute;
      top: -100px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-bright), var(--white), var(--purple-bright), transparent);
      box-shadow: 0 0 20px var(--accent-bright), 0 0 40px var(--purple-main);
      opacity: 0.8;
      animation: scan-sweep 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
      z-index: 7;
    }

    @keyframes scan-sweep {
      0% { top: -50px; opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { top: 1150px; opacity: 0; }
    }

    .manga-speedlines {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(168, 85, 247, 0.08) 70%, rgba(168, 85, 247, 0.22) 100%),
                  repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 4deg, rgba(255, 255, 255, 0.02) 4.5deg, transparent 5deg);
      pointer-events: none;
      z-index: 1;
      animation: pulse-speedlines 8s ease-in-out infinite alternate;
    }

    @keyframes pulse-speedlines {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.03); opacity: 1; }
    }

    .halftone-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      mask-image: linear-gradient(135deg, black 40%, transparent 90%);
      pointer-events: none;
      z-index: 1;
    }

    .kanji-watermark {
      position: absolute;
      right: 180px;
      bottom: 80px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 260px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      line-height: 1;
      writing-mode: vertical-rl;
      pointer-events: none;
      letter-spacing: -20px;
      z-index: 1;
    }

    .user-gif-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .gif-x-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 340px;
      height: 340px;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      opacity: 0.32;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
      animation: pulse-x-compact 4.5s ease-in-out infinite alternate;
    }

    .gif-x-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes pulse-x-compact {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.22; }
      100% { transform: translate(-50%, -50%) scale(1.04); opacity: 0.38; }
    }

    .gif-slice-left-wrap {
      position: absolute;
      top: 50%;
      left: 60px;
      width: 240px;
      height: 320px;
      transform: translateY(-50%) rotate(-10deg);
      mix-blend-mode: screen;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
    }

    .gif-slice-left-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gif-slice-right-wrap {
      position: absolute;
      top: 50%;
      right: 60px;
      width: 240px;
      height: 320px;
      transform: translateY(-50%) rotate(10deg) scaleX(-1);
      mix-blend-mode: screen;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
    }

    .gif-slice-right-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slash-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .crystal-cluster-tr {
      position: absolute;
      top: -100px;
      right: 40px;
      width: 520px;
      height: 700px;
      filter: drop-shadow(-25px 30px 50px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 40px var(--purple-glow));
    }

    .facet-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .crystal-cluster-br {
      position: absolute;
      bottom: -120px;
      right: -60px;
      width: 580px;
      height: 750px;
      filter: drop-shadow(-30px -20px 60px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 50px var(--purple-glow));
    }

    .crystal-cluster-tl {
      position: absolute;
      top: -80px;
      left: -60px;
      width: 480px;
      height: 600px;
      filter: drop-shadow(25px 25px 50px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 40px var(--purple-glow));
    }

    .crystal-cluster-bl {
      position: absolute;
      bottom: 20px;
      left: 120px;
      width: 320px;
      height: 420px;
      filter: drop-shadow(20px -20px 40px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px var(--purple-glow));
    }

    .star-flare-item {
      position: absolute;
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 15px var(--accent-bright)) drop-shadow(0 0 25px #ffffff);
      z-index: 5;
    }
    .flare-1 { top: 120px; right: 280px; }
    .flare-2 { bottom: 220px; right: 180px; }
    .flare-3 { top: 220px; left: 160px; }

    .star-flare-svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
    }

    .stream-header {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-frame {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      overflow: hidden;
      border: 2.5px solid var(--white);
      box-shadow: 0 0 25px var(--purple-glow), 0 0 45px var(--accent-glow);
      transform: skewX(-8deg);
      background: #000000;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: skewX(8deg) scale(1.08);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .channel-title {
      font-family: 'Bebas Neue', 'Kanit', sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 25px var(--purple-glow);
    }

    .channel-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-bright);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: #000000;
      border: 2px solid #ef4444;
      transform: skewX(-12deg);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }

    .live-indicator-content {
      transform: skewX(12deg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 14px #ef4444;
      animation: pulse-dot 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    .live-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }

    .stream-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      width: 90%;
      max-width: 1280px;
    }

    .scene-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 24px;
      background: linear-gradient(90deg, var(--purple-deep), var(--accent-main));
      border: 1px solid var(--accent-bright);
      transform: skewX(-12deg);
      margin-bottom: 22px;
      box-shadow: 0 4px 25px var(--accent-glow);
    }

    .scene-tag span {
      transform: skewX(12deg);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--white);
      font-weight: 700;
    }

    .main-heading {
      font-family: 'Bebas Neue', 'Kanit', sans-serif;
      font-size: 110px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 
        4px 4px 0px #000000, 
        8px 8px 0px #1a0833, 
        12px 12px 0px var(--purple-deep),
        16px 16px 0px var(--border-purple),
        0 0 35px var(--purple-glow);
      margin-bottom: 24px;
    }

    .sub-heading {
      font-size: 24px;
      font-weight: 400;
      color: #ecfdf5;
      max-width: 960px;
      margin: 0 auto;
      line-height: 1.65;
      background: rgba(7, 6, 14, 0.88);
      padding: 18px 44px;
      border-left: 5px solid var(--accent-bright);
      border-right: 5px solid var(--purple-bright);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
    }

    .stream-footer {
      position: absolute;
      bottom: 50px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .clean-social-row {
      display: flex;
      align-items: center;
      background: rgba(7, 6, 14, 0.85);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1.5px solid var(--purple-bright);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), 0 0 25px var(--purple-glow);
    }

    .social-clean-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-svg-icon {
      width: 24px;
      height: 24px;
      fill: var(--purple-bright);
      filter: drop-shadow(0 0 8px var(--purple-main));
    }

    .social-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #cbd5e1;
    }

    .social-text {
      font-family: 'Space Grotesk', 'Kanit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 14px;
      border-radius: 8px;
      border: 1px solid var(--purple-bright);
    }
  </style>
</head>
<body>

  <div class="stream-canvas">
    <canvas id="sparksCanvas"></canvas>
    <div class="laser-scanner"></div>

    <div class="manga-speedlines"></div>
    <div class="halftone-overlay"></div>
    <div class="kanji-watermark">配信終了</div>

    <div class="user-gif-container">
      <div class="gif-x-wrapper">
        <img src="asset2.gif" alt="Cyber X Tunnel" onerror="this.style.display='none'">
      </div>
      <div class="gif-slice-left-wrap">
        <img src="asset1.gif" alt="Cyber Slices Left" onerror="this.style.display='none'">
      </div>
      <div class="gif-slice-right-wrap">
        <img src="asset1.gif" alt="Cyber Slices Right" onerror="this.style.display='none'">
      </div>
    </div>

    <div class="slash-container">
      <div class="crystal-cluster-tr">
        <svg class="facet-svg" viewBox="0 0 520 700">
          <polygon points="120,40 420,80 340,580 80,480" fill="url(#gradDarkViolet)" opacity="0.95" stroke="#4c1d95" stroke-width="2"/>
          <polygon points="180,0 480,40 380,520 120,440" fill="url(#gradPurpleGlass)" opacity="0.85" stroke="#a855f7" stroke-width="3"/>

        </svg>
      </div>

      <div class="crystal-cluster-br">
        <svg class="facet-svg" viewBox="0 0 580 750">

          <polygon points="0,40 380,0 280,480 0,380" fill="url(#gradAccentGlass)" opacity="0.8" stroke="var(--accent-main)" stroke-width="3"/>
          <polygon points="40,100 420,60 320,540 40,440" fill="url(#gradDarkViolet)" opacity="0.9" stroke="#4c1d95" stroke-width="2"/>
          <polygon points="0,40 380,0 420,60 40,100" fill="url(#gradWhiteHighlight)" opacity="0.9" stroke="#ffffff" stroke-width="2"/>
          <line x1="380" y1="0" x2="280" y2="480" stroke="var(--accent-bright)" stroke-width="3" filter="drop-shadow(0 0 10px var(--accent-bright))"/>

      <div class="crystal-cluster-bl">
        <svg class="facet-svg" viewBox="0 0 320 420">
          <polygon points="60,20 280,80 200,380 0,300" fill="url(#gradPurpleGlass)" opacity="0.85" stroke="#a855f7" stroke-width="3"/>
          <polygon points="100,80 320,140 240,420 40,340" fill="url(#gradAccentGlass)" opacity="0.75" stroke="var(--accent-main)" stroke-width="2"/>
          <line x1="60" y1="20" x2="200" y2="380" stroke="#ffffff" stroke-width="2.5"/>
        </svg>
      </div>
    </div>

    <div class="star-flare-item flare-1">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>
    <div class="star-flare-item flare-2">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>
    <div class="star-flare-item flare-3">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>

    <svg width="0" height="0" style="position: absolute;">
      <defs>
        <linearGradient id="gradPurpleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gradDarkViolet" x1="0%" y1="0%" x2="100%" y2="100%">

    <div class="stream-header">

      <h1 class="main-heading">THANKS FOR WATCHING</h1>

  </div>

  <script>
    const chromaticStops = [
      { r: 6,   g: 182, b: 212, br: 103, bg: 232, bb: 249 },
      { r: 217, g: 70,  b: 239, br: 244, bg: 114, bb: 182 },
      { r: 244, g: 63,  b: 94,  br: 251, bg: 113, bb: 133 },
      { r: 245, g: 158, b: 11,  br: 253, bg: 224, bb: 71  },
      { r: 16,  g: 185, b: 129, br: 110, bg: 231, bb: 183 },
    ];
    let colorProgress = 0;
    let curBrightR = chromaticStops[0].br;
    let curBrightG = chromaticStops[0].bg;
    let curBrightB = chromaticStops[0].bb;

    function lerp(a, b, t) { return a + (b - a) * t; }

    const canvas = document.getElementById('sparksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    const sparks = [];
    for (let i = 0; i < 50; i++) {
      sparks.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        size: Math.random() * 3 + 1,
        speedY: (Math.random() * 1.5 + 0.6),
        alpha: Math.random() * 0.8 + 0.2,
      });
    }

    function render() {
      colorProgress += 0.0012;
      if (colorProgress >= chromaticStops.length) colorProgress -= chromaticStops.length;
      const curIdx = Math.floor(colorProgress);
      const nextIdx = (curIdx + 1) % chromaticStops.length;
      const t = (1 - Math.cos((colorProgress - curIdx) * Math.PI)) / 2;

      const c1 = chromaticStops[curIdx];
      const c2 = chromaticStops[nextIdx];
      const r = Math.round(lerp(c1.r, c2.r, t));
      const g = Math.round(lerp(c1.g, c2.g, t));
      const b = Math.round(lerp(c1.b, c2.b, t));
      curBrightR = Math.round(lerp(c1.br, c2.br, t));
      curBrightG = Math.round(lerp(c1.bg, c2.bg, t));
      curBrightB = Math.round(lerp(c1.bb, c2.bb, t));

      const root = document.documentElement;
      root.style.setProperty('--accent-main', `rgb(${r}, ${g}, ${b})`);
      root.style.setProperty('--accent-bright', `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`);
      root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.65)`);

      ctx.clearRect(0, 0, 1920, 1080);
      sparks.forEach(s => {
        s.y -= s.speedY;
        if (s.y < -10) s.y = 1090;
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#c084fc';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
