<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatthewDrake - Scene 2: Just Chatting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:ital,wght@0,300;0,500;0,600;0,800;0,900;1,800&family=Noto+Sans+JP:wght@700;900&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-bright: #c084fc;
      --purple-deep: #4c1d95;
      --bg-black: #07060e;
      --white: #ffffff;
      
      --accent-main: rgb(6, 182, 212);
      --accent-bright: rgb(103, 232, 249);
      --accent-glow: rgba(6, 182, 212, 0.65);
      
      --purple-glow: rgba(168, 85, 247, 0.6);
      --border-purple: rgba(168, 85, 247, 0.45);
      --gray-text: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-black);
      font-family: 'Kanit', 'Bebas Neue', sans-serif;
      color: var(--white);
    }

    .stream-canvas {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      background: var(--bg-black);
      overflow: hidden;
    }

    #sparksCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
    }

    .laser-scanner {
      position: absolute;
      top: -100px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-bright), var(--white), var(--purple-bright), transparent);
      box-shadow: 0 0 20px var(--accent-bright), 0 0 40px var(--purple-main);
      opacity: 0.8;
      animation: scan-sweep 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
      z-index: 7;
    }

    @keyframes scan-sweep {
      0% { top: -50px; opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { top: 1150px; opacity: 0; }
    }

    .manga-speedlines {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(168, 85, 247, 0.08) 70%, rgba(168, 85, 247, 0.22) 100%),
                  repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 4deg, rgba(255, 255, 255, 0.02) 4.5deg, transparent 5deg);
      pointer-events: none;
      z-index: 1;
      animation: pulse-speedlines 8s ease-in-out infinite alternate;
    }

    @keyframes pulse-speedlines {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.03); opacity: 1; }
    }

    .halftone-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      mask-image: linear-gradient(135deg, black 40%, transparent 90%);
      pointer-events: none;
      z-index: 1;
    }

    .kanji-watermark {
      position: absolute;
      right: 180px;
      bottom: 80px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 260px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      line-height: 1;
      writing-mode: vertical-rl;
      pointer-events: none;
      letter-spacing: -20px;
      z-index: 1;
    }

    /* Header */
    .stream-header {
      position: absolute;
      top: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-frame {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      overflow: hidden;
      border: 2.5px solid var(--white);
      box-shadow: 0 0 25px var(--purple-glow), 0 0 45px var(--accent-glow);
      transform: skewX(-8deg);
      background: #000000;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: skewX(8deg) scale(1.08);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .channel-title {
      font-family: 'Bebas Neue', 'Kanit', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 25px var(--purple-glow);
    }

    .channel-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-bright);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 22px;
      background: #000000;
      border: 2px solid var(--accent-bright);
      transform: skewX(-12deg);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .live-indicator-content {
      transform: skewX(12deg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background: var(--accent-bright);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent-bright);
      animation: pulse-dot 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    .live-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }

    /* Just Chatting Layout Frame (Cam 16:9 + Chat Widget Box) */
    .just-chatting-frame {
      position: absolute;
      top: 130px;
      left: 60px;
      right: 60px;
      bottom: 95px;
      display: flex;
      gap: 28px;
      z-index: 10;
    }

    .cam-box {
      flex: 2.3;
      background: rgba(4, 3, 8, 0.45);
      border: 3px solid rgba(168, 85, 247, 0.6);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 30px var(--purple-glow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .cam-box-label {
      position: absolute;
      top: 14px;
      left: 18px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--accent-bright);
      background: rgba(7, 6, 14, 0.85);
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid var(--accent-bright);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .chat-box {
      flex: 1;
      background: rgba(4, 3, 8, 0.55);
      border: 3px solid rgba(6, 182, 212, 0.5);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 25px var(--accent-glow);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      backdrop-filter: blur(6px);
    }

    .chat-box-header {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--white);
      border-bottom: 2px solid var(--accent-main);
      padding-bottom: 8px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Footer */
    .stream-footer {
      position: absolute;
      bottom: 35px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .clean-social-row {
      display: flex;
      align-items: center;
      background: rgba(7, 6, 14, 0.85);
      padding: 8px 22px;
      border-radius: 30px;
      border: 1.5px solid var(--purple-bright);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), 0 0 25px var(--purple-glow);
    }

    .social-clean-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-svg-icon {
      width: 22px;
      height: 22px;
      fill: var(--purple-bright);
      filter: drop-shadow(0 0 8px var(--purple-main));
    }

    .social-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1.5px;
      color: #cbd5e1;
    }

    .social-text {
      font-family: 'Space Grotesk', 'Kanit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 12px;
      border-radius: 8px;
      border: 1px solid var(--purple-bright);
    }
  </style>
</head>
<body>

  <div class="stream-canvas">
    <canvas id="sparksCanvas"></canvas>
    <div class="laser-scanner"></div>

    <div class="manga-speedlines"></div>
    <div class="halftone-overlay"></div>
    <div class="kanji-watermark">雑談配信中</div>

    <!-- Header -->
    <div class="stream-header">
      <div class="brand-container">
        <div class="avatar-frame">
          <img src="avatar.png" alt="Matthew Avatar" class="avatar-img" onerror="this.style.opacity='0.2'">
        </div>
        <div class="brand-text">
          <div class="channel-title">MATTHEWDRAKE</div>
          <div class="channel-sub">JUST CHATTING & FIVEM</div>
        </div>
      </div>

      <div class="live-indicator">
        <div class="live-indicator-content">
          <div class="live-dot"></div>
          <div class="live-text">JUST CHATTING</div>
        </div>
      </div>
    </div>

    <!-- Just Chatting Windows Layout -->
    <div class="just-chatting-frame">
      <!-- Camera Window Frame -->
      <div class="cam-box">
        <div class="cam-box-label">
          <span>● CAM / CAPTURE AREA</span>
        </div>
      </div>

      <!-- Live Chat Window Frame -->
      <div class="chat-box">
        <div class="chat-box-header">
          <span>LIVE CHAT</span>
          <span style="color: var(--accent-bright); font-size: 16px;">MATTHEWDRAKE</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="stream-footer">
      <div class="clean-social-row">
        <div class="social-clean-item">
          <svg class="social-svg-icon" viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.098.246.195.373.288a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.893a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span class="social-label">DISCORD:</span>
          <span class="social-text">_newgen</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chromaticStops = [
      { r: 6,   g: 182, b: 212, br: 103, bg: 232, bb: 249 },
      { r: 217, g: 70,  b: 239, br: 244, bg: 114, bb: 182 },
      { r: 244, g: 63,  b: 94,  br: 251, bg: 113, bb: 133 },
      { r: 245, g: 158, b: 11,  br: 253, bg: 224, bb: 71  },
      { r: 16,  g: 185, b: 129, br: 110, bg: 231, bb: 183 },
    ];
    let colorProgress = 0;
    let curBrightR = chromaticStops[0].br;
    let curBrightG = chromaticStops[0].bg;
    let curBrightB = chromaticStops[0].bb;

    function lerp(a, b, t) { return a + (b - a) * t; }

    const canvas = document.getElementById('sparksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    const sparks = [];
    for (let i = 0; i < 40; i++) {
      sparks.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        size: Math.random() * 3 + 1,
        speedY: (Math.random() * 1.5 + 0.6),
        alpha: Math.random() * 0.8 + 0.2,
      });
    }

    function render() {
      colorProgress += 0.0012;
      if (colorProgress >= chromaticStops.length) colorProgress -= chromaticStops.length;
      const curIdx = Math.floor(colorProgress);
      const nextIdx = (curIdx + 1) % chromaticStops.length;
      const t = (1 - Math.cos((colorProgress - curIdx) * Math.PI)) / 2;

      const c1 = chromaticStops[curIdx];
      const c2 = chromaticStops[nextIdx];
      const r = Math.round(lerp(c1.r, c2.r, t));
      const g = Math.round(lerp(c1.g, c2.g, t));
      const b = Math.round(lerp(c1.b, c2.b, t));
      curBrightR = Math.round(lerp(c1.br, c2.br, t));
      curBrightG = Math.round(lerp(c1.bg, c2.bg, t));
      curBrightB = Math.round(lerp(c1.bb, c2.bb, t));

      const root = document.documentElement;
      root.style.setProperty('--accent-main', `rgb(${r}, ${g}, ${b})`);
      root.style.setProperty('--accent-bright', `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`);
      root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.65)`);

      ctx.clearRect(0, 0, 1920, 1080);
      sparks.forEach(s => {
        s.y -= s.speedY;
        if (s.y < -10) s.y = 1090;
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#c084fc';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
