<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layer 2 - Crystals & Cyber GIFs</title>
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-bright: #c084fc;
      --purple-deep: #4c1d95;
      --white: #ffffff;
      
      --accent-main: rgb(6, 182, 212);
      --accent-bright: rgb(103, 232, 249);
      --accent-glow: rgba(6, 182, 212, 0.65);
      
      --purple-glow: rgba(168, 85, 247, 0.6);
      --border-purple: rgba(168, 85, 247, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .stream-canvas {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent !important;
      overflow: hidden;
    }

    /* Cyber GIFs */
    .user-gif-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .gif-x-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 340px;
      height: 340px;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      opacity: 0.32;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
      animation: pulse-x-compact 4.5s ease-in-out infinite alternate;
    }

    .gif-x-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes pulse-x-compact {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.22; }
      100% { transform: translate(-50%, -50%) scale(1.04); opacity: 0.38; }
    }

    .gif-slice-left-wrap {
      position: absolute;
      top: 50%;
      left: 60px;
      width: 240px;
      height: 320px;
      transform: translateY(-50%) rotate(-10deg);
      mix-blend-mode: screen;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
    }

    .gif-slice-left-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gif-slice-right-wrap {
      position: absolute;
      top: 50%;
      right: 60px;
      width: 240px;
      height: 320px;
      transform: translateY(-50%) rotate(10deg) scaleX(-1);
      mix-blend-mode: screen;
      opacity: 0.22;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
    }

    .gif-slice-right-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 3D Crystal Shards */
    .slash-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .crystal-cluster-tr {
      position: absolute;
      top: -100px;
      right: 40px;
      width: 520px;
      height: 700px;
      filter: drop-shadow(-25px 30px 50px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 40px var(--purple-glow));
    }

    .facet-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .crystal-cluster-br {
      position: absolute;
      bottom: -120px;
      right: -60px;
      width: 580px;
      height: 750px;
      filter: drop-shadow(-30px -20px 60px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 50px var(--purple-glow));
    }

    .crystal-cluster-tl {
      position: absolute;
      top: -80px;
      left: -60px;
      width: 480px;
      height: 600px;
      filter: drop-shadow(25px 25px 50px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 40px var(--purple-glow));
    }

    .crystal-cluster-bl {
      position: absolute;
      bottom: 20px;
      left: 120px;
      width: 320px;
      height: 420px;
      filter: drop-shadow(20px -20px 40px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px var(--purple-glow));
    }

    .star-flare-item {
      position: absolute;
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 15px var(--accent-bright)) drop-shadow(0 0 25px #ffffff);
      z-index: 5;
    }
    .flare-1 { top: 120px; right: 280px; }
    .flare-2 { bottom: 220px; right: 180px; }
    .flare-3 { top: 220px; left: 160px; }

    .star-flare-svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="stream-canvas">
    <!-- User GIFs -->
    <div class="user-gif-container">
      <div class="gif-x-wrapper">
        <img src="asset2.gif" alt="Cyber X Tunnel" onerror="this.style.display='none'">
      </div>
      <div class="gif-slice-left-wrap">
        <img src="asset1.gif" alt="Cyber Slices Left" onerror="this.style.display='none'">
      </div>
      <div class="gif-slice-right-wrap">
        <img src="asset1.gif" alt="Cyber Slices Right" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- 3D Crystal Shards -->
    <div class="slash-container">
      <div class="crystal-cluster-tr">
        <svg class="facet-svg" viewBox="0 0 520 700">
          <polygon points="120,40 420,80 340,580 80,480" fill="url(#gradDarkViolet)" opacity="0.95" stroke="#4c1d95" stroke-width="2"/>
          <polygon points="180,0 480,40 380,520 120,440" fill="url(#gradPurpleGlass)" opacity="0.85" stroke="#a855f7" stroke-width="3"/>
          <polygon points="180,0 480,40 420,80 120,40" fill="url(#gradAccentGlint)" opacity="0.95" stroke="#ffffff" stroke-width="2"/>
          <polygon points="220,120 460,180 360,620 160,540" fill="url(#gradAccentGlass)" opacity="0.75" stroke="var(--accent-bright)" stroke-width="3"/>
          <line x1="180" y1="0" x2="380" y2="520" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 0 10px #ffffff)"/>
        </svg>
      </div>

      <div class="crystal-cluster-br">
        <svg class="facet-svg" viewBox="0 0 580 750">
          <polygon points="160,120 540,60 440,700 80,620" fill="url(#gradDarkViolet)" opacity="0.95" stroke="#3b0764" stroke-width="2"/>
          <polygon points="120,60 500,0 400,640 40,560" fill="url(#gradPurpleGlass)" opacity="0.85" stroke="#a855f7" stroke-width="3"/>
          <polygon points="80,180 440,120 340,680 0,600" fill="url(#gradAccentGlint)" opacity="0.4" stroke="var(--accent-main)" stroke-width="2"/>
          <line x1="120" y1="60" x2="400" y2="640" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 0 12px var(--accent-bright))"/>
        </svg>
      </div>

      <div class="crystal-cluster-tl">
        <svg class="facet-svg" viewBox="0 0 480 600">
          <polygon points="0,40 380,0 280,480 0,380" fill="url(#gradAccentGlass)" opacity="0.8" stroke="var(--accent-main)" stroke-width="3"/>
          <polygon points="40,100 420,60 320,540 40,440" fill="url(#gradDarkViolet)" opacity="0.9" stroke="#4c1d95" stroke-width="2"/>
          <polygon points="0,40 380,0 420,60 40,100" fill="url(#gradWhiteHighlight)" opacity="0.9" stroke="#ffffff" stroke-width="2"/>
          <line x1="380" y1="0" x2="280" y2="480" stroke="var(--accent-bright)" stroke-width="3" filter="drop-shadow(0 0 10px var(--accent-bright))"/>
        </svg>
      </div>

      <div class="crystal-cluster-bl">
        <svg class="facet-svg" viewBox="0 0 320 420">
          <polygon points="60,20 280,80 200,380 0,300" fill="url(#gradPurpleGlass)" opacity="0.85" stroke="#a855f7" stroke-width="3"/>
          <polygon points="100,80 320,140 240,420 40,340" fill="url(#gradAccentGlass)" opacity="0.75" stroke="var(--accent-main)" stroke-width="2"/>
          <line x1="60" y1="20" x2="200" y2="380" stroke="#ffffff" stroke-width="2.5"/>
        </svg>
      </div>
    </div>

    <!-- Star Flares -->
    <div class="star-flare-item flare-1">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>
    <div class="star-flare-item flare-2">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>
    <div class="star-flare-item flare-3">
      <svg class="star-flare-svg" viewBox="0 0 100 100">
        <path d="M50 0 C50 35 35 50 0 50 C35 50 50 65 50 100 C50 65 65 50 100 50 C65 50 50 35 50 0 Z"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
      </svg>
    </div>

    <!-- SVG Gradients -->
    <svg width="0" height="0" style="position: absolute;">
      <defs>
        <linearGradient id="gradPurpleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gradDarkViolet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2e1065" stop-opacity="0.98"/>
          <stop offset="100%" stop-color="#090514" stop-opacity="0.98"/>
        </linearGradient>
        <linearGradient id="gradAccentGlass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--accent-bright)" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="var(--accent-main)" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#083344" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="gradAccentGlint" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="60%" stop-color="var(--accent-bright)" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="var(--accent-main)" stop-opacity="0.6"/>
        </linearGradient>
        <linearGradient id="gradWhiteHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <script>
    const chromaticStops = [
      { r: 6,   g: 182, b: 212, br: 103, bg: 232, bb: 249 },
      { r: 217, g: 70,  b: 239, br: 244, bg: 114, bb: 182 },
      { r: 244, g: 63,  b: 94,  br: 251, bg: 113, bb: 133 },
      { r: 245, g: 158, b: 11,  br: 253, bg: 224, bb: 71  },
      { r: 16,  g: 185, b: 129, br: 110, bg: 231, bb: 183 },
    ];
    let colorProgress = 0;
    function lerp(a, b, t) { return a + (b - a) * t; }

    function render() {
      colorProgress += 0.0012;
      if (colorProgress >= chromaticStops.length) colorProgress -= chromaticStops.length;
      const curIdx = Math.floor(colorProgress);
      const nextIdx = (curIdx + 1) % chromaticStops.length;
      const t = (1 - Math.cos((colorProgress - curIdx) * Math.PI)) / 2;

      const c1 = chromaticStops[curIdx];
      const c2 = chromaticStops[nextIdx];
      const r = Math.round(lerp(c1.r, c2.r, t));
      const g = Math.round(lerp(c1.g, c2.g, t));
      const b = Math.round(lerp(c1.b, c2.b, t));
      const curBrightR = Math.round(lerp(c1.br, c2.br, t));
      const curBrightG = Math.round(lerp(c1.bg, c2.bg, t));
      const curBrightB = Math.round(lerp(c1.bb, c2.bb, t));

      const root = document.documentElement;
      root.style.setProperty('--accent-main', `rgb(${r}, ${g}, ${b})`);
      root.style.setProperty('--accent-bright', `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`);
      root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.65)`);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
