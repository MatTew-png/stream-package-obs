<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layer 3 - Header Branding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:ital,wght@0,300;0,500;0,600;0,800;0,900;1,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-bright: #c084fc;
      --purple-deep: #4c1d95;
      --white: #ffffff;
      
      --accent-main: rgb(6, 182, 212);
      --accent-bright: rgb(103, 232, 249);
      --accent-glow: rgba(6, 182, 212, 0.65);
      
      --purple-glow: rgba(168, 85, 247, 0.6);
      --border-purple: rgba(168, 85, 247, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Kanit', 'Bebas Neue', sans-serif;
      color: var(--white);
    }

    .stream-canvas {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent !important;
      overflow: hidden;
    }

    /* Header */
    .stream-header {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-frame {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      overflow: hidden;
      border: 2.5px solid var(--white);
      box-shadow: 0 0 25px var(--purple-glow), 0 0 45px var(--accent-glow);
      transform: skewX(-8deg);
      background: #000000;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: skewX(8deg) scale(1.08);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .channel-title {
      font-family: 'Bebas Neue', 'Kanit', sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 25px var(--purple-glow);
    }

    .channel-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-bright);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: #000000;
      border: 2px solid var(--accent-bright);
      transform: skewX(-12deg);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .live-indicator-content {
      transform: skewX(12deg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background: var(--accent-bright);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent-bright);
      animation: pulse-dot 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    .live-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }
  </style>
</head>
<body>

  <div class="stream-canvas">
    <div class="stream-header">
      <div class="brand-container">
        <div class="avatar-frame">
          <img src="avatar.png" alt="Matthew Avatar" class="avatar-img" onerror="this.style.opacity='0.2'">
        </div>
        <div class="brand-text">
          <div class="channel-title">MATTHEWDRAKE</div>
          <div class="channel-sub">FIVEM & JUST TALK</div>
        </div>
      </div>

      <div class="live-indicator">
        <div class="live-indicator-content">
          <div class="live-dot"></div>
          <div class="live-text">STARTING SOON</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chromaticStops = [
      { r: 6,   g: 182, b: 212, br: 103, bg: 232, bb: 249 },
      { r: 217, g: 70,  b: 239, br: 244, bg: 114, bb: 182 },
      { r: 244, g: 63,  b: 94,  br: 251, bg: 113, bb: 133 },
      { r: 245, g: 158, b: 11,  br: 253, bg: 224, bb: 71  },
      { r: 16,  g: 185, b: 129, br: 110, bg: 231, bb: 183 },
    ];
    let colorProgress = 0;
    function lerp(a, b, t) { return a + (b - a) * t; }

    function render() {
      colorProgress += 0.0012;
      if (colorProgress >= chromaticStops.length) colorProgress -= chromaticStops.length;
      const curIdx = Math.floor(colorProgress);
      const nextIdx = (curIdx + 1) % chromaticStops.length;
      const t = (1 - Math.cos((colorProgress - curIdx) * Math.PI)) / 2;

      const c1 = chromaticStops[curIdx];
      const c2 = chromaticStops[nextIdx];
      const r = Math.round(lerp(c1.r, c2.r, t));
      const g = Math.round(lerp(c1.g, c2.g, t));
      const b = Math.round(lerp(c1.b, c2.b, t));
      const curBrightR = Math.round(lerp(c1.br, c2.br, t));
      const curBrightG = Math.round(lerp(c1.bg, c2.bg, t));
      const curBrightB = Math.round(lerp(c1.bb, c2.bb, t));

      const root = document.documentElement;
      root.style.setProperty('--accent-main', `rgb(${r}, ${g}, ${b})`);
      root.style.setProperty('--accent-bright', `rgb(${curBrightR}, ${curBrightG}, ${curBrightB})`);
      root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.65)`);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
